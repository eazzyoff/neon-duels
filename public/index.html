<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Неоновые Дуэли: 80 Игр</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем Socket.io напрямую с нашего сервера -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { overscroll-behavior: none; background-color: #050505; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        .glass-panel { background: rgba(15, 15, 25, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        .neon-card { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s; }
        .neon-card:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 0 25px rgba(6, 182, 212, 0.6), inset 0 0 15px rgba(236, 72, 153, 0.4); border-color: rgba(255,255,255,0.6); z-index: 10; }
        .text-gradient { background: linear-gradient(to right, #06b6d4, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        canvas { display: block; filter: drop-shadow(0 0 20px rgba(0,0,0,1)); touch-action: none;}
        
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); text-shadow: 0 0 40px currentColor; } 100% { transform: scale(1); } }
        .score-pop { animation: pop 0.4s ease-out; }
        .av-btn { transition: all 0.2s; }
        .av-btn.active { transform: scale(1.4); filter: drop-shadow(0 0 15px #fff); z-index: 10; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

        input { background: rgba(0,0,0,0.5); border: 2px solid #333; color: white; text-align: center; outline: none; transition: border 0.3s; }
        input:focus { border-color: #06b6d4; box-shadow: 0 0 15px rgba(6,182,212,0.3); }

        .modal-overlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden flex justify-center items-center">

    <!-- ЭКРАН КАСТОМИЗАЦИИ (С НИКНЕЙМАМИ) -->
    <div id="customUI" class="absolute inset-0 z-[60] bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMDUwNTA1Ij48L3JlY3Q+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiMxYTFhMWEiPjwvcmVjdD4KPC9zdmc+')] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="absolute inset-0 bg-black opacity-60"></div>
        <h1 class="text-4xl md:text-7xl font-black text-gradient mb-6 drop-shadow-[0_0_20px_rgba(6,182,212,0.8)] text-center z-10 uppercase tracking-widest">Создание Бойцов</h1>
        
        <div class="flex flex-col md:flex-row gap-6 md:gap-12 mb-8 overflow-y-auto max-h-[65vh] md:max-h-full p-4 z-10 w-full max-w-5xl justify-center">
            <!-- Игрок 1 -->
            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center border-t-4 border-cyan-500 w-full md:w-96 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-cyan-500 shadow-[0_0_20px_#06b6d4]"></div>
                <h2 class="text-cyan-400 font-bold text-xl mb-4 uppercase tracking-widest">Твой Боец (P1)</h2>
                <input type="text" id="p1NameInput" maxlength="12" placeholder="НИКНЕЙМ" class="w-full py-2 px-4 rounded-xl text-xl font-bold mb-4 uppercase tracking-wider" value="ИГРОК 1">
                <div id="p1AvPreview" class="text-7xl md:text-8xl mb-6 drop-shadow-[0_0_25px_rgba(6,182,212,1)] transition-transform hover:scale-110 cursor-pointer">🐺</div>
                <div id="p1AvGrid" class="grid grid-cols-6 gap-3 text-2xl md:text-3xl w-full justify-items-center bg-black bg-opacity-40 p-4 rounded-2xl"></div>
            </div>
            
            <!-- Игрок 2 -->
            <div class="glass-panel p-6 rounded-3xl flex flex-col items-center border-t-4 border-pink-500 w-full md:w-96 relative overflow-hidden" id="p2CustomBlock">
                <div class="absolute top-0 left-0 w-full h-1 bg-pink-500 shadow-[0_0_20px_#ec4899]"></div>
                <h2 class="text-pink-400 font-bold text-xl mb-4 uppercase tracking-widest">Соперник (P2)</h2>
                <input type="text" id="p2NameInput" maxlength="12" placeholder="НИКНЕЙМ" class="w-full py-2 px-4 rounded-xl text-xl font-bold mb-4 uppercase tracking-wider" value="ИГРОК 2">
                <div id="p2AvPreview" class="text-7xl md:text-8xl mb-6 drop-shadow-[0_0_25px_rgba(236,72,153,1)] transition-transform hover:scale-110 cursor-pointer">🐍</div>
                <div id="p2AvGrid" class="grid grid-cols-6 gap-3 text-2xl md:text-3xl w-full justify-items-center bg-black bg-opacity-40 p-4 rounded-2xl"></div>
                <p class="text-xs text-pink-300 mt-3 text-center opacity-80">По сети аватар и ник выберет соперник.</p>
            </div>
        </div>
        
        <button onclick="window.closeCustomUI()" class="z-10 glass-panel text-white px-16 py-5 rounded-full text-2xl md:text-3xl font-black border-b-4 border-green-500 hover:bg-green-600 hover:bg-opacity-40 transition-all shadow-[0_10px_40px_rgba(34,197,94,0.4)] uppercase tracking-[0.2em] hover:scale-105 active:scale-95 hover:-translate-y-2">
            НА АРЕНУ ⚔️
        </button>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА ДЛЯ СЕТИ -->
    <div id="netModal" class="modal-overlay absolute inset-0 z-[70] hidden flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-3xl border-t-4 border-cyan-500 flex flex-col items-center max-w-md w-full text-center">
            <h2 id="netModalTitle" class="text-3xl font-black text-white mb-4 uppercase">Ожидание...</h2>
            <div id="loader" class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4 hidden"></div>
            <p id="netModalDesc" class="text-lg text-cyan-300 mb-6 font-bold uppercase tracking-wider">Код комнаты: <br><span id="netRoomCode" class="text-6xl text-white block mt-4 drop-shadow-[0_0_15px_#fff] tracking-[0.2em]">----</span></p>
            <input type="number" id="netJoinInput" class="hidden w-full bg-gray-900 border-2 border-cyan-500 text-white text-center text-4xl p-4 rounded-2xl mb-6 outline-none focus:border-pink-500 transition tracking-[0.2em]" placeholder="1234">
            
            <div class="flex gap-4 w-full">
                <button id="netActionBtn" class="hidden flex-1 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-4 rounded-xl transition shadow-[0_0_20px_rgba(6,182,212,0.6)] uppercase tracking-wider">Войти</button>
                <button onclick="window.closeNetModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 rounded-xl transition uppercase tracking-wider border border-gray-600">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu" class="hidden absolute inset-0 z-50 flex flex-col items-center p-4 md:p-6 overflow-y-auto bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-black to-black">
        <div class="flex justify-between items-center w-full max-w-[95%] px-2 mt-2 md:mt-4">
            <button onclick="window.openCustomUI()" class="glass-panel px-3 py-2 md:px-5 md:py-3 rounded-2xl text-cyan-400 font-bold hover:bg-cyan-900 hover:bg-opacity-50 transition flex items-center gap-3 border border-cyan-900 hover:border-cyan-500">
                <span id="menuP1Av" class="text-3xl drop-shadow-[0_0_10px_#06b6d4]">🐺</span> <div class="flex flex-col items-start hidden sm:flex"><span class="text-[10px] uppercase text-gray-400">Игрок 1</span><span id="menuP1Name" class="text-sm uppercase tracking-wider">Игрок 1</span></div>
            </button>
            <h1 class="text-4xl md:text-7xl font-black text-gradient tracking-[0.2em] uppercase drop-shadow-[0_0_20px_rgba(6,182,212,0.6)] text-center">АРЕНА 80</h1>
            <button onclick="window.openCustomUI()" class="glass-panel px-3 py-2 md:px-5 md:py-3 rounded-2xl text-pink-400 font-bold hover:bg-pink-900 hover:bg-opacity-50 transition flex items-center gap-3 border border-pink-900 hover:border-pink-500 flex-row-reverse">
                <span id="menuP2Av" class="text-3xl drop-shadow-[0_0_10px_#ec4899]">🐍</span> <div class="flex flex-col items-end hidden sm:flex"><span class="text-[10px] uppercase text-gray-400">Игрок 2</span><span id="menuP2Name" class="text-sm uppercase tracking-wider">Игрок 2</span></div>
            </button>
        </div>
        
        <!-- Сетевая панель -->
        <div class="flex flex-wrap justify-center gap-4 mt-6 md:mt-10 mb-6 glass-panel px-6 py-5 rounded-3xl border-t-2 border-b-2 border-indigo-500 shadow-[0_0_30px_rgba(99,102,241,0.15)] w-full max-w-4xl" id="networkPanel">
            <button onclick="window.createRoom()" class="flex-1 min-w-[200px] bg-gradient-to-r from-cyan-700 to-blue-700 hover:from-cyan-500 hover:to-blue-500 text-white font-black py-4 px-6 rounded-2xl transition-all shadow-[0_0_20px_rgba(6,182,212,0.5)] hover:scale-105 uppercase tracking-widest text-sm md:text-base flex items-center justify-center gap-3"><span class="text-2xl">🌐</span> Создать Игру</button>
            <button onclick="window.showJoinModal()" class="flex-1 min-w-[200px] bg-gradient-to-r from-pink-700 to-purple-700 hover:from-pink-500 hover:to-purple-500 text-white font-black py-4 px-6 rounded-2xl transition-all shadow-[0_0_20px_rgba(236,72,153,0.5)] hover:scale-105 uppercase tracking-widest text-sm md:text-base flex items-center justify-center gap-3"><span class="text-2xl">🔗</span> Войти по Коду</button>
        </div>
        
        <div class="flex flex-col items-center mb-8 bg-black bg-opacity-50 px-8 py-3 rounded-full border border-gray-800">
            <p id="localLegend" class="text-gray-300 text-sm md:text-base tracking-[0.3em] uppercase font-bold text-center"><span class="text-cyan-500">Локальный Режим</span> • Серия до 3 побед</p>
            <p id="onlineLegend" class="hidden text-green-400 text-sm md:text-base tracking-[0.3em] uppercase font-bold text-center drop-shadow-[0_0_10px_#22c55e] animate-pulse">Socket.io Соединение Установлено • Выбирайте Игру</p>
        </div>

        <div id="gameGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-8 gap-3 w-full max-w-[98%] pb-24">
            <!-- Карточки генерируются скриптом -->
        </div>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="gameUI" class="hidden absolute inset-0 z-10 bg-black flex justify-center items-center">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Панели счета -->
        <div class="absolute top-4 left-4 md:top-6 md:left-8 glass-panel rounded-2xl px-4 py-3 border-l-4 border-cyan-500 flex items-center gap-3 md:gap-5 z-20 shadow-[0_0_30px_rgba(6,182,212,0.3)]">
            <div id="score1Av" class="text-5xl md:text-6xl drop-shadow-[0_0_20px_rgba(6,182,212,1)]">🐺</div>
            <div class="flex flex-col items-start">
                <span id="score1Name" class="text-cyan-400 font-black tracking-widest text-[10px] md:text-sm uppercase drop-shadow-md">ИГРОК 1</span>
                <div class="flex gap-1 mt-1" id="p1Stars"></div>
            </div>
        </div>
        
        <div class="absolute top-4 right-4 md:top-6 md:right-8 glass-panel rounded-2xl px-4 py-3 border-r-4 border-pink-500 flex items-center gap-3 md:gap-5 flex-row-reverse z-20 shadow-[0_0_30px_rgba(236,72,153,0.3)]">
            <div id="score2Av" class="text-5xl md:text-6xl drop-shadow-[0_0_20px_rgba(236,72,153,1)]">🐍</div>
            <div class="flex flex-col items-end">
                <span id="score2Name" class="text-pink-400 font-black tracking-widest text-[10px] md:text-sm uppercase drop-shadow-md">ИГРОК 2</span>
                <div class="flex gap-1 mt-1 flex-row-reverse" id="p2Stars"></div>
            </div>
        </div>

        <button onclick="window.backToMenu()" class="absolute bottom-6 left-1/2 transform -translate-x-1/2 md:left-8 md:translate-x-0 glass-panel text-gray-400 hover:text-white px-8 py-3 rounded-full font-bold uppercase tracking-[0.2em] transition hover:scale-105 border border-gray-700 hover:border-red-500 hover:bg-red-900 hover:bg-opacity-50 z-20 text-xs md:text-sm">
            Сдаться
        </button>

        <!-- Сенсорное управление -->
        <div class="absolute bottom-20 left-0 right-0 flex justify-between px-6 z-20 sm:hidden opacity-40 hover:opacity-80 transition-opacity">
            <div class="grid grid-cols-3 gap-2 w-36">
                <div></div><button class="touch-btn bg-gray-800 p-5 rounded-2xl border-b-4 border-gray-900 active:border-b-0 active:translate-y-1" data-key="ArrowUp">⬆️</button><div></div>
                <button class="touch-btn bg-gray-800 p-5 rounded-2xl border-b-4 border-gray-900 active:border-b-0 active:translate-y-1" data-key="ArrowLeft">⬅️</button>
                <button class="touch-btn bg-gray-800 p-5 rounded-2xl border-b-4 border-gray-900 active:border-b-0 active:translate-y-1" data-key="ArrowDown">⬇️</button>
                <button class="touch-btn bg-gray-800 p-5 rounded-2xl border-b-4 border-gray-900 active:border-b-0 active:translate-y-1" data-key="ArrowRight">➡️</button>
            </div>
            <div class="flex items-center justify-center w-28">
                <button class="touch-btn bg-red-700 p-6 rounded-full w-full h-full text-4xl border-b-8 border-red-900 active:border-b-0 active:translate-y-2 shadow-[0_0_20px_rgba(239,68,68,0.5)]" data-key="Enter">🔥</button>
            </div>
        </div>

        <!-- Экран старта / Окончания -->
        <div id="roundOverlay" class="absolute inset-0 bg-black bg-opacity-85 backdrop-blur-lg z-40 flex flex-col justify-center items-center transition-opacity duration-300">
            <h2 id="roundTitle" class="text-5xl md:text-8xl font-black text-white mb-6 uppercase tracking-[0.1em] text-gradient text-center px-4 drop-shadow-[0_0_30px_rgba(6,182,212,0.6)] leading-tight">Название</h2>
            <p id="roundDesc" class="text-xl md:text-3xl text-gray-300 mb-12 max-w-3xl text-center px-4 font-bold tracking-widest leading-relaxed border-t border-b border-gray-800 py-4">Описание.</p>
            <div id="countdown" class="text-[8rem] md:text-[15rem] font-black text-white drop-shadow-[0_0_50px_rgba(255,255,255,1)] mb-8"></div>
        </div>
    </div>

    <!-- Модуль Игры + Socket.io -->
    <script>
        // --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ СЕТИ ---
        let socket = null;
        try { socket = io(); } catch(e) { console.warn("Socket.io не найден. Игра работает в локальном режиме."); }

        let isMultiplayer = false, isHost = false;
        let remoteKeys = { up:false, dn:false, lf:false, rt:false, en:false };
        let lastInputsStr = "", syncCounter = 0;

        // --- КАСТОМИЗАЦИЯ И ДАННЫЕ ИГРОКОВ ---
        const EMOJIS = ['🐺','🐍','🐯','🐉','🦂','🦅','🦈','🦖','🦇','🦍','😈','💀','👽','🤖','👻','🎃','🔥','⚡️','🧊','🌪️','🦊','🐼','🦄','🐙'];
        window.p1A = '🐺'; window.p2A = '🐍';
        window.p1N = 'ИГРОК 1'; window.p2N = 'ИГРОК 2';

        window.initCustomUI = () => {
            const g1 = document.getElementById('p1AvGrid'), g2 = document.getElementById('p2AvGrid');
            const n1 = document.getElementById('p1NameInput'), n2 = document.getElementById('p2NameInput');
            
            n1.addEventListener('input', (e) => { window.p1N = e.target.value || 'ИГРОК 1'; window.updateScoreAvatars(); });
            n2.addEventListener('input', (e) => { window.p2N = e.target.value || 'ИГРОК 2'; window.updateScoreAvatars(); });

            EMOJIS.forEach(e => {
                let b1 = document.createElement('div'); b1.innerText = e; b1.className = 'av-btn cursor-pointer transition flex justify-center hover:scale-125';
                if(e === window.p1A) b1.classList.add('active');
                b1.onclick = () => { window.p1A = e; document.getElementById('p1AvPreview').innerText = e; updateAvSelection(g1, b1); };
                g1.appendChild(b1);

                let b2 = document.createElement('div'); b2.innerText = e; b2.className = 'av-btn cursor-pointer transition flex justify-center hover:scale-125';
                if(e === window.p2A) b2.classList.add('active');
                b2.onclick = () => { window.p2A = e; document.getElementById('p2AvPreview').innerText = e; updateAvSelection(g2, b2); };
                g2.appendChild(b2);
            });
            window.updateScoreAvatars();
        };
        
        function updateAvSelection(grid, activeBtn) {
            Array.from(grid.children).forEach(c => c.classList.remove('active'));
            activeBtn.classList.add('active');
            window.updateScoreAvatars();
        }
        
        window.updateScoreAvatars = () => {
            document.getElementById('score1Av').innerText = window.p1A; document.getElementById('score2Av').innerText = window.p2A;
            document.getElementById('menuP1Av').innerText = window.p1A; document.getElementById('menuP2Av').innerText = window.p2A;
            document.getElementById('score1Name').innerText = window.p1N; document.getElementById('score2Name').innerText = window.p2N;
            document.getElementById('menuP1Name').innerText = window.p1N; document.getElementById('menuP2Name').innerText = window.p2N;
            
            if(isMultiplayer && socket) {
                if(isHost) socket.emit('gameData', { type:'profile', a:window.p1A, n:window.p1N });
                else socket.emit('gameData', { type:'profile', a:window.p1A, n:window.p1N }); 
            }
        };
        
        window.closeCustomUI = () => { document.getElementById('customUI').classList.add('hidden'); document.getElementById('menu').classList.remove('hidden'); };
        window.openCustomUI = () => { document.getElementById('menu').classList.add('hidden'); document.getElementById('customUI').classList.remove('hidden'); };

        // --- ДВИЖОК ИГРЫ ---
        const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
        const overlay = document.getElementById('roundOverlay');
        const titleEl = document.getElementById('roundTitle'), descEl = document.getElementById('roundDesc'), countdownEl = document.getElementById('countdown');
        
        const W = 1600, H = 900, TARGET_SCORE = 3;
        let scale = 1, currentId = -1, loopId, gameState = 'MENU', p1Score = 0, p2Score = 0, particles = [];
        let globalTm = 0, shake = 0, trails = [];
        const C1 = '#06b6d4', C2 = '#ec4899', CN = '#eab308'; 
        
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; sendNetInputs(); });
        window.addEventListener('keyup', e => { keys[e.code] = false; sendNetInputs(); });

        document.querySelectorAll('.touch-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[btn.dataset.key] = true; sendNetInputs(); btn.classList.add('bg-gray-600'); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[btn.dataset.key] = false; sendNetInputs(); btn.classList.remove('bg-gray-600'); });
        });

        const kw=()=> isMultiplayer && !isHost ? false : keys['KeyW'];
        const ks=()=> isMultiplayer && !isHost ? false : keys['KeyS'];
        const ka=()=> isMultiplayer && !isHost ? false : keys['KeyA'];
        const kd=()=> isMultiplayer && !isHost ? false : keys['KeyD'];
        const sp=()=> isMultiplayer && !isHost ? false : keys['Space'];

        const ku=()=> isMultiplayer ? (isHost ? remoteKeys.up : keys['ArrowUp']) : keys['ArrowUp'];
        const kdn=()=> isMultiplayer ? (isHost ? remoteKeys.dn : keys['ArrowDown']) : keys['ArrowDown'];
        const kl=()=> isMultiplayer ? (isHost ? remoteKeys.lf : keys['ArrowLeft']) : keys['ArrowLeft'];
        const kr=()=> isMultiplayer ? (isHost ? remoteKeys.rt : keys['ArrowRight']) : keys['ArrowRight'];
        const en=()=> isMultiplayer ? (isHost ? remoteKeys.en : keys['Enter']) : keys['Enter'];
        
        const doShake = (mag) => { shake = mag; };

        const m1 = (o, s) => { let m=false; if(kw()){o.y-=s;m=true;} if(ks()){o.y+=s;m=true;} if(ka()){o.x-=s;m=true;} if(kd()){o.x+=s;m=true;} if(m) addTrail(o.x, o.y, C1, 35); };
        const m2 = (o, s) => { let m=false; if(ku()){o.y-=s;m=true;} if(kdn()){o.y+=s;m=true;} if(kl()){o.x-=s;m=true;} if(kr()){o.x+=s;m=true;} if(m) addTrail(o.x, o.y, C2, 35); };
        const cl = (o, p=45) => { o.x=Math.max(p,Math.min(W-p,o.x)); o.y=Math.max(p,Math.min(H-p,o.y)); };
        const D = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
        const rnd = (m) => Math.random()*m;

        const rect = (x,y,w,h,c,b=15,a=1) => { ctx.save(); ctx.globalAlpha=a; ctx.shadowBlur=b; ctx.shadowColor=c; ctx.fillStyle=c; ctx.fillRect(x,y,w,h); ctx.restore(); };
        const circ = (x,y,r,c,b=15,a=1) => { ctx.save(); ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.shadowBlur=b; ctx.shadowColor=c; ctx.fillStyle=c; ctx.fill(); ctx.restore(); };
        const line = (x1,y1,x2,y2,c,w=5,b=15,a=1) => { ctx.save(); ctx.globalAlpha=a; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.shadowBlur=b; ctx.shadowColor=c; ctx.stroke(); ctx.restore(); };

            { n: "Король Горы", d: "Стой в центре 👑, чтобы набрать 100%!", i:()=>{o1={x:W/4,y:H/2,s:0};o2={x:W*.75,y:H/2,s:0};}, u:()=>{ m1(o1,14); m2(o2,14); cl(o1); cl(o2); if(D(o1,{x:W/2,y:H/2})<220){o1.s+=0.4; spawnParticles(W/2,H/2,C1,2);} if(D(o2,{x:W/2,y:H/2})<220){o2.s+=0.4; spawnParticles(W/2,H/2,C2,2);} if(o1.s>=100)winRound(1); else if(o2.s>=100)winRound(2); }, r:()=>{ circ(W/2,H/2,220,CN,60,0.35); E('👑',W/2,H/2,100); txt(Math.floor(o1.s)+'%',200,120,80); txt(Math.floor(o2.s)+'%',W-200,120,80); drawA(1,o1,100); drawA(2,o2,100); } }

        const baseGamesCount = games.length;

            games.push({
                n: baseGame.n + " (ХАРДКОР)",
                d: baseGame.d + " Скорость х2! ОПАСНО!",

                u: () => { baseGame.u(); baseGame.u(); }, // Двойной апдейт = двойная скорость

        // --- УПРАВЛЕНИЕ МЕНЮ ---
        function initMenu() {
            const grid = document.getElementById('gameGrid');
            games.forEach((g, i) => {
                const btn = document.createElement('div');
                btn.className = `neon-card glass-panel rounded-xl p-3 flex flex-col justify-center items-center cursor-pointer group h-28 relative overflow-hidden`;
                btn.innerHTML = `
                    <div class="absolute inset-0 bg-gradient-to-br from-transparent to-${i%2===0?'cyan':'pink'}-900 opacity-20 group-hover:opacity-50 transition"></div>
                    <div class="text-xl font-black text-gray-400 group-hover:text-white mb-1 transition z-10">${i + 1}</div>
                    <h3 class="text-[10px] md:text-xs font-bold text-center text-gray-200 group-hover:text-white leading-tight z-10 drop-shadow-md">${g.n}</h3>
                `;
                btn.onclick = () => setupGame(i);
                grid.appendChild(btn);
            });
        }

        function setupGame(id) {
            currentId = id;
            p1Score = 0; 
            p2Score = 0;
            updateStars();
            
            menu.classList.add('hidden');
            gameUI.classList.remove('hidden');
            overlay.classList.remove('hidden');
            
            titleEl.innerText = games[currentId].n;
            descEl.innerText = games[currentId].d;
            startBtn.classList.remove('hidden');
            countdownEl.innerText = "";
            
            gameState = 'READY';
            
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            if(!loopId) loop();
        }

        function startRound() {
            startBtn.classList.add('hidden');
            let count = 3;
            countdownEl.innerText = count;
            let iv = setInterval(() => {
                count--;
                if(count > 0) { 
                    countdownEl.innerText = count; 
                } else if (count === 0) { 
                    countdownEl.innerText = "БОЙ!"; 
                } else {
                    clearInterval(iv);
                    overlay.classList.add('hidden');
                    particles = [];
                    games[currentId].i();
                    gameState = 'PLAY';
                }
            }, 700);
        }

        function backToMenu() {
            gameState = 'MENU';
            currentId = -1;
            if(loopId) { cancelAnimationFrame(loopId); loopId = null; }
            window.removeEventListener('resize', resizeCanvas);
            gameUI.classList.add('hidden');
            overlay.classList.add('hidden');
            menu.classList.remove('hidden');
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            scale = Math.min(canvas.width / W, canvas.height / H);
        }

        function loop() {
            if(gameState === 'MENU' || currentId === -1) return;

            // След движения (Motion Blur)
            ctx.fillStyle = 'rgba(5, 5, 10, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const oX = (canvas.width - W * scale) / 2;
            const oY = (canvas.height - H * scale) / 2;

            ctx.save();
            ctx.translate(oX, oY);
            ctx.scale(scale, scale);

            // Тряска экрана (Screen Shake)
            if (shake > 0) {
                ctx.translate(rnd(shake)-shake/2, rnd(shake)-shake/2);
                shake *= 0.85;
                if(shake < 0.5) shake = 0;
            }

            rect(0, 0, W, H, 'transparent', 0);
            
            // Сетка фона
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.05)'; 
            ctx.lineWidth = 2;
            let offset = (globalTm * 2) % 60;
            ctx.beginPath();
            for(let i=0; i<W; i+=60) { ctx.moveTo(i, offset); ctx.lineTo(i, H); }
            for(let i=0; i<H; i+=60) { ctx.moveTo(offset, i); ctx.lineTo(W, i); }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; 
            ctx.lineWidth = 4; 
            ctx.strokeRect(0, 0, W, H);

            if(gameState === 'PLAY') {
                games[currentId].u();
                globalTm++;
            }
            
            drawTrails();

            if(gameState !== 'READY' || particles.length > 0) {
                games[currentId].r();
            }
            
            updateDrawParticles();

            ctx.restore();
            loopId = requestAnimationFrame(loop);
        }

        window.onload = () => {
            initCustomUI();
            initMenu();
        };
